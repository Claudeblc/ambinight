<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1830"/>
      <stop offset="1" stop-color="#06060b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <clipPath id="sq"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- halo Ambilight autour de l'écran -->
    <g filter="url(#halo)">
      <ellipse cx="292" cy="500" rx="150" ry="215" fill="#22d3ee"/>
      <ellipse cx="512" cy="330" rx="250" ry="120" fill="#8b5cf6"/>
      <ellipse cx="732" cy="500" rx="150" ry="215" fill="#ec4899"/>
      <ellipse cx="512" cy="676" rx="250" ry="110" fill="#f97316"/>
    </g>
    <!-- écran -->
    <rect x="262" y="350" width="500" height="306" rx="40" fill="#07070d"/>
    <rect x="262" y="350" width="500" height="306" rx="40" fill="none" stroke="#fff" stroke-width="22"/>
    <!-- signe Ambinight -->
    <path d="M512 408v192M512 470c-36 0-62 17-75 37M512 470c36 0 62 17 75 37M452 548h120" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"/>
    <!-- pied -->
    <path d="M436 732h152" stroke="#fff" stroke-width="22" stroke-linecap="round" opacity=".9"/>
    <rect width="1024" height="1024" rx="228" fill="url(#rim)" opacity=".6"/>
  </g>
</svg>
