<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6edff"/>
      <stop offset="1" stop-color="#fff0e6"/>
    </linearGradient>
    <linearGradient id="ring" x1="250" y1="230" x2="780" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f7bff"/>
      <stop offset=".5" stop-color="#9a8cff"/>
      <stop offset="1" stop-color="#ffb27d"/>
    </linearGradient>
    <radialGradient id="core" cx="490" cy="470" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1ff"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="sq"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- logo Ambinight -->
    <circle cx="512" cy="530" r="320" fill="url(#ring)" opacity=".4" filter="url(#glow)"/>
    <circle cx="512" cy="512" r="300" fill="url(#ring)"/>
    <circle cx="528" cy="496" r="144" fill="url(#core)"/>
  </g>
</svg>
