<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- anneau : bleu froid vers pêche, comme le logo de l'application -->
    <linearGradient id="ring" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f7bff"/>
      <stop offset=".5" stop-color="#9a8cff"/>
      <stop offset="1" stop-color="#ffb27d"/>
    </linearGradient>
    <radialGradient id="core" cx="30" cy="28" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1ff"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="25" fill="url(#ring)" opacity=".45" filter="url(#soft)"/>
  <circle cx="32" cy="32" r="24" fill="url(#ring)"/>
  <circle cx="33" cy="31" r="11.5" fill="url(#core)"/>
</svg>
